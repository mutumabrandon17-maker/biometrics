<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://flaticon.com">
    <title>trace 1 - Biometric Face Recognitions</title>

    <!-- Real Biometric Face Recognition Library (TensorFlow.js backend) -->
    <script defer src="https://jsdelivr.net"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e5e7eb;
            min-height: 100vh;
        }

        /* AUTH PRE-LOGIN WORKSPACE */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .auth-card h2 {
            color: #38bdf8;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .auth-toggle span {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
        }

        /* PRIMARY APP FRAMEWORK */
        .app-shell {
            display: none; /* Controlled dynamically by script wrapper */
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #111827;
            border-right: 1px solid #1f2937;
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-badge {
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border: 1px solid #334155;
        }

        .user-badge span {
            color: #38bdf8;
            font-weight: bold;
        }

        .nav-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: #9ca3af;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #1e293b;
            color: #38bdf8;
            border-color: #334155;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 32px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h3 {
            margin-bottom: 16px;
            color: #f8fafc;
        }

        /* ANALYTICS GRID PANEL */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .metric-card h4 {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .metric-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* INPUTS & INTERACTION COMPONENTS */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #0369a1;
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* TRACKER VIDEO FRAME DESIGN */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 16px;
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .status-box {
            margin-top: 12px;
            padding: 10px;
            background: #0f172a;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 0.9rem;
        }

        /* LIVE ROSTER TABLE MATRIX */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0f172a;
            color: #38bdf8;
        }

        tr:hover td {
            background: #24334d;
        }

        .avatar-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #38bdf8;
        }

        #matchResults {
            margin-top: 16px;
        }

        .match-card {
            display: flex;
            gap: 16px;
            align-items: center;
            background: #0f172a;
            border: 1px solid #0284c7;
            padding: 16px;
            border-radius: 6px;
        }

        .match-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #38bdf8;
        }
    </style>
</head>

<body>

    <!-- PORTAL ACCESS BOX WORKSPACE -->
    <div id="authContainer" class="auth-container">
        <div class="auth-card" id="loginFormCard">
            <h2>System Access Authorization</h2>
            <p style="color: #94a3b8; text-align: center; font-size: 0.85rem; margin-bottom: 24px;">Trace 1 Operator Network Verification</p>
            <div class="input-group">
                <label>Username Account Key</label>
                <input type="text" id="loginUser" placeholder="Enter credentials...">
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn" style="width: 100%;" onclick="executeAuthentication()">Authenticate Portal</button>
            <div class="auth-toggle">Need an access profile? <span onclick="toggleAuthForms(true)">Register Operator</span></div>
        </div>

        <div class="auth-card" id="registerFormCard" style="display: none;">
            <h2>Register New Operator</h2>
            <p style="color: #94a3b8; text-align: center; font-size: 0.85rem; margin-bottom: 24px;">Establish new monitoring credentials</p>
            <div class="input-group">
                <label>Assign Username</label>
                <input type="text" id="regUser" placeholder="e.g. admin_trace">
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <button class="btn" style="width: 100%; background: #10b981;" onclick="executeRegistration()">Save Operator Credentials</button>
            <div class="auth-toggle">Existing profile? <span onclick="toggleAuthForms(false)">Return to Login</span></div>
        </div>
    </div>

    <!-- PRIMARY DASHBOARD INTERFACE CORE -->
    <div id="appShell" class="app-shell">
        <div class="sidebar">
            <h2>Trace 1</h2>
            <div class="user-badge">Active Op: <span id="currentOpBadge">None</span></div>
            <button class="nav-btn active" id="btn-dash" onclick="switchTab('dashboardTab')">Main Dashboard</button>
